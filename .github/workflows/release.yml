name: Release Dashboard

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version component to increment (first release is always 1.0.0)
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: dashboard-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and all tags
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Calculate release version
        id: version
        env:
          VERSION_BUMP: ${{ inputs.bump }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess

          tags = subprocess.check_output(["git", "tag", "--list"], text=True).splitlines()
          versions = []
          for tag in tags:
              match = re.fullmatch(r"v?(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)", tag)
              if match:
                  versions.append(tuple(map(int, match.groups())))

          bump = os.environ["VERSION_BUMP"]
          if bump not in {"major", "minor", "patch"}:
              raise ValueError("Unsupported version component")
          if not versions:
              version = "1.0.0"
          else:
              major, minor, patch = max(versions)
              if bump == "major":
                  major, minor, patch = major + 1, 0, 0
              elif bump == "minor":
                  minor, patch = minor + 1, 0
              else:
                  patch += 1
              version = f"{major}.{minor}.{patch}"

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\n")
          print(f"Release version: {version}")
          PY

      - name: Package Dashboard
        id: package
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          staging_dir=$(mktemp -d "$RUNNER_TEMP/dashboard.XXXXXX")
          trap 'rm -rf "$staging_dir"' EXIT

          # Respect export-ignore rules, then remove the Dashboard/ wrapper.
          git archive --format=tar HEAD Dashboard/ | tar -xf - --strip-components=1 -C "$staging_dir"

          python3 - "$staging_dir/manifest.json" <<'PY'
          import json
          import os
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          manifest = json.loads(path.read_text())
          manifest["version"] = os.environ["RELEASE_VERSION"]
          path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + "\n")
          PY

          archive_path="$RUNNER_TEMP/Dashboard-${RELEASE_VERSION}.zip"
          (cd "$staging_dir" && zip -rq "$archive_path" .)
          unzip -tq "$archive_path"
          echo "path=$archive_path" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
          ARCHIVE_PATH: ${{ steps.package.outputs.path }}
        run: |
          gh release create "$RELEASE_VERSION" "$ARCHIVE_PATH" \
            --target "$RELEASE_COMMIT" \
            --title "Dashboard $RELEASE_VERSION" \
            --generate-notes
